name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  analyze-test-build:
    name: Analyze, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # CI never has real secrets for PRs from forks; write a placeholder
      # so the app's asset bundling step (pubspec.yaml: assets: - .env.client)
      # has a file to embed. Real values are only needed at runtime, not to
      # analyze/test/compile. On `main`, prefer repo secrets if configured.
      - name: Write .env.client
        run: |
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env.client
            echo "SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" >> .env.client
          else
            cp .env.client.example .env.client
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (drift, injectable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK (dev flavor)
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart

  # 16KB memory-page compatibility is mandatory for Play Store updates since
  # 1 Nov 2025 (refined plan C7). This job installs the debug APK on a
  # 16KB-page AVD image and does a smoke boot. Best-effort: nested
  # virtualization on GH-hosted runners can be flaky, so failures here don't
  # block the required job above — investigate but don't treat as a hard gate.
  page-size-16kb-smoke:
    name: 16KB page-size smoke test
    runs-on: ubuntu-latest
    needs: analyze-test-build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Write .env.client
        run: cp .env.client.example .env.client

      - run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on 16KB-page emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # google_apis_ps16k targets ship with 16KB page size enabled by
          # default (see Android Developers 16KB migration guide).
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_6
          script: |
            flutter build apk --debug --flavor dev -t lib/main_dev.dart
            adb install build/app/outputs/flutter-apk/app-dev-debug.apk
            echo "16KB page-size install smoke test passed."
