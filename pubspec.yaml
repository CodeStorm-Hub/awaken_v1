name: awaken
description: "Awaken — gamified alarm and fitness app with territory capture."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Dependency injection
  get_it: ^8.0.0
  injectable: ^2.5.0

  # Backend / auth / realtime
  supabase_flutter: ^2.16.0
  flutter_dotenv: ^6.0.0

  # Offline-first local database (source of truth)
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Alarm scheduling & ringing (replaces android_alarm_manager_plus — see plan H1)
  alarm: ^5.5.0

  # Biometric verification pipeline
  camera: ^0.12.0
  google_mlkit_pose_detection: ^0.15.0
  google_mlkit_commons: ^0.12.0

  # Territory / geospatial
  flutter_foreground_task: ^10.0.0
  geolocator: ^14.0.3
  kalman_dr: ^0.4.4
  flutter_map: ^8.3.0
  flutter_map_tile_caching: ^10.1.1
  latlong2: ^0.9.1
  turf: ^0.0.12

  # Cross-cutting
  uuid: ^4.6.0
  permission_handler: ^12.0.0
  dynamic_color: ^1.7.0
  wakelock_plus: ^1.2.8
  connectivity_plus: ^6.1.0
  sentry_flutter: ^9.0.0
  motor: ^1.1.0

  # Type (UI/UX plan "Emphatic Typography" — Roboto Flex/Google Sans Flex
  # variable font; Google Sans Flex isn't publicly distributed, so this
  # substitutes Roboto Flex, per the Claude Design handoff's fonts.css).
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.5
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.34.0
  injectable_generator: ^2.6.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.0
  patrol: ^3.16.0

flutter:
  uses-material-design: true
  assets:
    - .env.client

dependency_overrides:
  flutter_fgbg: 0.7.1
