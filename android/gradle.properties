org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Windows-only workaround: the Kotlin build-tools-api incremental compiler
# intermittently fails to close its on-disk caches under J:\...\build\<module>
# (file-lock/AV interference), producing "Could not close incremental
# caches" errors. Disabling incremental Kotlin compilation trades a slower
# clean-ish build for reliability. Revisit if upstream fixes this.
kotlin.incremental=false
