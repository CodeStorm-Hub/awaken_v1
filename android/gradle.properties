android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Windows-only workaround for the Kotlin build-tools-api incremental
# compiler intermittently failing to close its on-disk caches under
# J:\...\build\<module> (file-lock/AV interference), producing "Could not
# close incremental caches" errors. Disabling incremental Kotlin compilation
# trades a slower clean-ish build for reliability. Revisit if upstream fixes
# this. Applied conditionally (Windows only) from settings.gradle.kts rather
# than unconditionally here, so Linux/CI/macOS builds keep incremental
# compilation instead of paying this workaround's cost for a bug that
# doesn't affect them.
